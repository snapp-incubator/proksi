# Default values for proksi.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  registry: ghcr.io
  repository: snapp-incubator/proksi
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          backend:
            serviceName: chart-example.local
            servicePort: 80
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Configs
# Log level for application logging
# Options: debug, info, warn, error, fatal
logLevel: "warn"

# Storage backend type: "elasticsearch" or "stdout"
# Use "stdout" to output JSON logs directly to stdout instead of Elasticsearch
storageType: "stdout"

elasticsearch:
  addresses: ["http://elastic-http:9200"]
  username: ""
  password: ""

upstreams:
  main:
    url: "http://localhost:8080"
  test:
    url: "http://localhost:8081"

worker:
  count: 50
  queueSize: 2048

skipJsonPaths: []

testProbability: 100

logResponsePayload: true

# Routes to skip entirely (no test upstream call)
# TODO: removing this key from config causes config loader error..
skipRoutes:
  - "GET:/"
  - "GET:/health"
  - "GET:/healthz/readiness"
  - "GET:/healthz"
  - "GET:/healthz/liveness"
  - "GET:/metrics"
  - "POST:/metrics"

# Global configuration that applies to all routes (unless overridden)
globalConfig:
  compareHeaders: false # Compare response headers by default
  compareBody: true
  skipHeaders: ["Date", "Server", "Content-Type"] # Headers to ignore during comparison
  storeReqBody: false # Store request body when responses differ
  storeRespBodies: true # Store response bodies when they differ
  skipJsonPaths: [] # JSON paths to ignore during comparison
  testProbability: 100 # Percentage of requests to send to test upstream

routeConfigs:
  "GET:/internal/v1/users":
    compareHeaders: disable # Disable header comparison for this route
    compareBody: disable
    storeReqBody: enable # Store request body when responses differ
    storeRespBodies: enable # Store response bodies when they differ
    testProbability: 100 # Percentage of requests to send to test upstream
  "GET:/api/v1/users/*/orders":
    compareHeaders: disable
    compareBody: enable
    storeReqBody: enable
    storeRespBodies: enable
    testProbability: 50
  "GET:/api/v1/users/*/invoices":
    compareHeaders: disable
    compareBody: enable
    storeReqBody: enable
    storeRespBodies: enable
    testProbability: 100
  # Example route configurations:
  # "POST:/api/v1/users":
  #   compareHeaders: false
  #   storeReqBody: true
  # "GET:/api/v1/users/*":
  #   skipHeaders: ["Authorization"]
  #   testProbability: 50
  # "GET:/api/v1/orders/*/items":
  #   skipHeaders: ["Order-Token"]
  #   testProbability: 75
  # "POST:/api/v1/users/*/posts/*":
  #   storeReqBody: true
  #   skipJsonPaths: ["user.id", "post.internal_id"]

metrics:
  enabled: true
  containerPort: 9001
  podMonitor:
    enabled: true
    interval: "10s"
