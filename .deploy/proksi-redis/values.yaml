# Default values for proksi.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  registry: ghcr.io
  repository: snapp-incubator/proksi
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 6379
  containerPort: 6380

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
      - path: /
        backend:
          serviceName: chart-example.local
          servicePort: 80
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Configs
# List of upstreams to proxy the command to them
upstreams:
  # main is the upstream that we are sure about its behavior and its response will be the criterion.
  # The response of the command will be the main upstream response.
  main:
    address: "127.0.0.1:6379"
    # Optional: treat this upstream as a Redis Cluster. When enabled, the proxy discovers
    # the slot->node topology via CLUSTER SLOTS against the seed addresses and routes each
    # keyed command to the node that owns its slot. Omit or set enabled:false for a single
    # (standalone) upstream, where every command goes to `address`.
    cluster:
      enabled: false
      addresses:
        - "127.0.0.1:6379"
  # test is the upstream that we want to test its behavior.
  # The commands will be sent to the test upstream asynchronously and its response will be discarded.
  test:
    address: "127.0.0.1:6381"
    cluster:
      enabled: false
      addresses:
        - "127.0.0.1:6381"

worker:
  count: 50
  queueSize: 2048

metrics:
  enabled: true
  containerPort: 9001
  podMonitor:
    enabled: true
    interval: "10s"
